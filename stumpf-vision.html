*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --burgundy-deeper: #3A0610;
  --gold: #C9A84C;
  --gold-light: #E2C47A;
}
body {
  background: var(--burgundy-deeper);
  min-height: 100vh;
  font-family: 'Agrandir', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1rem;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 20% 90%, rgba(123,13,30,0.5) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo-wrap {
  margin-bottom: 1.8rem;
  animation: fadeDown 0.8s ease both;
}
.logo-wrap img {
  width: 230px;
  display: block;
}
.tagline {
  font-family: 'Agrandir', sans-serif;
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--gold-light);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 2.8rem;
  opacity: 0.75;
  animation: fadeDown 0.8s 0.1s ease both;
}
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  border-radius: 3px;
  text-decoration: none;
  font-family: 'Syncopate', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transition: all 0.3s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary {
  background: var(--gold);
  color: var(--burgundy-deeper);
  box-shadow: 0 4px 28px rgba(201,168,76,0.28);
  animation: fadeUp 0.6s 0.25s ease both;
}
.btn-primary:hover {
  background: var(--gold-light);
  box-shadow: 0 6px 36px rgba(201,168,76,0.42);
}
.btn-outline {
  background: transparent;
  color: var(--gold-light);
  border: 1px solid rgba(201,168,76,0.38);
  animation: fadeUp 0.6s 0.4s ease both;
}
.btn-outline:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.divider {
  width: 36px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.35), transparent);
  margin: 2rem auto;
  animation: fadeIn 0.6s 0.55s ease both;
}
.footer {
  font-family: 'Syncopate', sans-serif;
  font-size: 9px;
  letter-spacing: 0.28em;
